<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 탭상단 바꾸는 태그 -->
    <title>태그 어쩌구 쏼라쏼라</title>
  </head>
  <!-- 메모용도 -->
   <!-- 단축키 ctrl + / -->
    <h1>큰제목</h1>
    <h2>중간제목</h2>
<!--  버튼 태그 -->
  <button>버튼</button>

  <!-- paragraph(문단) 태그 -->
   <p>힘들어 죽겠다 진짜 새우야 생일축하하고</p>

   <!-- a(anchor) 태그 -->
    <a href="">카카오톡 선물하기 바로가기</a>

    <!-- ol(ordered list) 태그 :순서대로 -->
<ol>
  <li>페퍼로니 피자</li>
  <li>포테이토 피자</li>
  <li>콤비네이션 피자</li>
</ol>
<!-- ul<unoredered list -->
 <ul>
  <li>페퍼로니 피자</li>
  <li>포테이토 피자</li>
  <li>콤비네이션 피자</li>
</ul>
<!-- img(image) 태그 -->
 <!-- src는 소스의 줄임말 alts는 대타의 줄임말 -->
  < img src="https://img1.daumcdn.net/thumb/R1280x0.fjpg/?fname=http://t1.daumcdn.net/brunch/service/user/enwp/image/7ssI4fHO5ybB_qX6ZjEydfFVx3o.jpeg">
<!-- div(division) 태그: 의미없는 태그 -->
  <div>아무의미없어서 제일 많이 쓰임</div>

  </body>
</html>
